# `isuscope init`が生成する最小構成です。AIまたは担当者が実環境に合わせて編集します。
data_dir = ".isuscope/data"

[source]
repo = "."
exclude = [".pprotein"]

[tooling]
# 当日実装したベンチアダプターと問題固有scriptを各runへ保存します。
include = ["benchmark.sh", "parse-benchmark.sh", "fingerprint.sh"]

# Codex hookが生成する会話履歴と各ベンチを厳密に紐付ける場合だけ有効化します。
# 設定するとCodex session/inputを解決できないrunはベンチ開始前に拒否されます。
# [context.codex]
# history_dir = "docs/codex-history"

[benchmark]
mode = "command"
# 当日の起動方法はbenchmark.shだけに実装します。入出力契約は同script冒頭を参照します。
command = [".isuscope/benchmark.sh"]
working_dir = "."
stream_output = false

# 問題固有の件数などがbenchmark stdoutに現れる場合に有効化します。
# parserはベンチ終了後に実行され、保存済みrunへ`isuscope enrich`で再適用できます。
# [[benchmark.parsers]]
# name = "contest-output"
# command = [".isuscope/parse-benchmark.sh", "{benchmark_stdout}"]
# timeout_seconds = 30

[ssh]
user = "ubuntu"
connect_timeout_seconds = 5

# [[nodes]]はSETUP.mdの手順に従って追加します。roleを指定しない以下の
# 標準collectorは、設定した全nodeでrun/discovery-runの両方に対して動きます。

# /procだけを使うため、remoteへの追加package導入なしで1秒ごとの基本host時系列を取ります。
[[collectors]]
name = "host-sampler"
phase = "during"
transport = "ssh"
command = ["sh", "-c", "set -eu\nread_cpu() { awk '/^cpu / { total=0; for(i=2;i<=NF;i++)total+=$i; print total, $5+$6 }' /proc/stat; }\nset -- $(read_cpu); pt=$1; pi=$2\nwhile :; do\n sleep 1; set -- $(read_cpu); t=$1; i=$2; dt=$((t-pt)); di=$((i-pi))\n cpu=$(awk -v dt=$dt -v di=$di 'BEGIN { if(dt<=0)print 0; else printf \"%.6f\",100*(dt-di)/dt }')\n mem=$(awk '/MemTotal:/{t=$2}/MemAvailable:/{a=$2}END{print (t-a)*1024}' /proc/meminfo)\n load=$(awk '{print $1}' /proc/loadavg); ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)\n printf '{\"type\":\"metric\",\"name\":\"host.cpu_percent\",\"value\":%s,\"unit\":\"percent\",\"timestamp\":\"%s\"}\\n' \"$cpu\" \"$ts\"\n printf '{\"type\":\"metric\",\"name\":\"host.memory_used_bytes\",\"value\":%s,\"unit\":\"bytes\",\"timestamp\":\"%s\"}\\n' \"$mem\" \"$ts\"\n printf '{\"type\":\"metric\",\"name\":\"host.load1\",\"value\":%s,\"unit\":\"load\",\"timestamp\":\"%s\"}\\n' \"$load\" \"$ts\"\n pt=$t; pi=$i\ndone"]

[[collectors]]
name = "sysstat"
phase = "during"
transport = "ssh"
command = ["sh", "-c", "command -v sar >/dev/null 2>&1 || exit 75; exec env LC_ALL=C TZ=UTC sar -u -d 1"]
parser = "sysstat"
unavailable_exit_codes = [75]

[[collectors]]
name = "perf-record"
phase = "during"
transport = "ssh"
command = ["sh", "-c", "command -v perf >/dev/null 2>&1 || exit 75; command -v sudo >/dev/null 2>&1 || exit 75; sudo -n true >/dev/null 2>&1 || exit 75; date +%s.%N > /tmp/isuscope-{run_id}.perf.start; exec sudo -n env LC_ALL=C perf record -a -F 99 -o /tmp/isuscope-{run_id}.perf.data -- sleep 86400"]
unavailable_exit_codes = [75]

[[collectors]]
name = "perf-report"
phase = "after"
transport = "ssh"
command = ["sh", "-c", "command -v perf >/dev/null 2>&1 || exit 75; command -v sudo >/dev/null 2>&1 || exit 75; sudo -n true >/dev/null 2>&1 || exit 75; test -s /tmp/isuscope-{run_id}.perf.data || exit 75; sudo -n env LC_ALL=C perf report --stdio --no-children --percent-limit 1 --sort comm,dso,symbol --fields overhead,comm,dso,symbol --field-separator ';' -i /tmp/isuscope-{run_id}.perf.data | awk -F';' '/^[ ]*[0-9]+[.][0-9]+%/ { pct=$1; sub(/%/,\"\",pct); gsub(/^[ ]+|[ ]+$/,\"\",pct); process=$2; binary=$3; symbol=$4; gsub(/^[ ]+|[ ]+$/,\"\",process); gsub(/^[ ]+|[ ]+$/,\"\",binary); gsub(/^[ ]+|[ ]+$/,\"\",symbol); gsub(/[\\\\\\\"]/,\"_\",process); gsub(/[\\\\\\\"]/,\"_\",binary); gsub(/[\\\\\\\"]/,\"_\",symbol); printf \"{\\\"type\\\":\\\"metric\\\",\\\"name\\\":\\\"cpu.sample_percent\\\",\\\"value\\\":%s,\\\"unit\\\":\\\"percent\\\",\\\"labels\\\":{\\\"process\\\":\\\"%s\\\",\\\"binary\\\":\\\"%s\\\",\\\"symbol\\\":\\\"%s\\\"}}\\n\",pct,process,binary,symbol }'"]
timeout_seconds = 30
unavailable_exit_codes = [75]

[[collectors]]
name = "perf-series"
phase = "after"
transport = "ssh"
command = ["sh", "-c", "data=/tmp/isuscope-{run_id}.perf.data; start=/tmp/isuscope-{run_id}.perf.start; cleanup() { sudo -n rm -f \"$data\" >/dev/null 2>&1 || true; rm -f \"$start\"; }; trap cleanup EXIT; command -v perf >/dev/null 2>&1 || exit 75; command -v sudo >/dev/null 2>&1 || exit 75; sudo -n true >/dev/null 2>&1 || exit 75; test -s \"$data\" || exit 75; test -s \"$start\" || exit 75; printf '# isuscope-perf-start %s\\n' \"$(cat \"$start\")\"; sudo -n env LC_ALL=C perf script --reltime --ns -F comm,time,event,ip,sym,dso -i \"$data\""]
parser = "perf-script"
timeout_seconds = 30
unavailable_exit_codes = [75]

# alp/slpはログ形式とpathが問題ごとに異なるため、SETUP.mdに従い以下の
# placeholderを実環境へ合わせます。設定から削除せず、対象がなければ75を返します。
[[collectors]]
name = "nginx-log-mark"
phase = "before"
transport = "ssh"
command = ["sh", "-c", '''
set -eu
log=/var/log/nginx/access.log
marker=/tmp/isuscope-{run_id}.nginx.marker
command -v sha256sum >/dev/null 2>&1 || exit 75
test -r "$log" || exit 75
offset=$(wc -c < "$log" | tr -d ' ')
sample=$offset
test "$sample" -le 65536 || sample=65536
digest=$(head -c "$sample" "$log" | sha256sum)
prefix=${digest%% *}
printf '%s %s %s\n' "$offset" "$sample" "$prefix" > "$marker"
''']
unavailable_exit_codes = [75]

[[collectors]]
name = "nginx-log-delta"
phase = "after"
transport = "ssh"
command = ["sh", "-c", '''
set -eu
log=/var/log/nginx/access.log
marker=/tmp/isuscope-{run_id}.nginx.marker
output=/tmp/isuscope-{run_id}.nginx.log
temporary=$output.tmp
trap 'rm -f "$temporary" "$marker"' EXIT
command -v sha256sum >/dev/null 2>&1 || exit 75
test -r "$log" || exit 75
test -r "$marker" || exit 75
read offset sample prefix < "$marker" || exit 75
case "$offset:$sample" in *[!0-9:]*|:*|*:) exit 75 ;; esac

stream_file() {
  case "$1" in
    *.gz) gzip -cd -- "$1" ;;
    *) cat -- "$1" ;;
  esac
}
pick_generation() {
  plain=$log.$1
  compressed=$plain.gz
  if test -r "$plain"; then
    printf '%s\n' "$plain"
  elif test -r "$compressed" && gzip -t -- "$compressed"; then
    printf '%s\n' "$compressed"
  else
    return 1
  fi
}
matches_marker() {
  size=$(stream_file "$1" | wc -c | tr -d ' ')
  test "$size" -ge "$offset" || return 1
  digest=$(stream_file "$1" | head -c "$sample" | sha256sum)
  test "${digest%% *}" = "$prefix"
}

: > "$temporary"
if matches_marker "$log"; then
  tail -c +$((offset + 1)) "$log" > "$temporary"
else
  origin_generation=0
  for generation in 1 2 3 4 5; do
    if candidate=$(pick_generation "$generation") && matches_marker "$candidate"; then
      origin_generation=$generation
      origin=$candidate
      break
    fi
  done
  if test "$origin_generation" -eq 0; then
    echo 'access log rotated beyond retained generations or failed fingerprint validation' >&2
    exit 75
  fi
  stream_file "$origin" | tail -c +$((offset + 1)) > "$temporary"
  generation=$((origin_generation - 1))
  while test "$generation" -ge 1; do
    candidate=$(pick_generation "$generation") || {
      echo "access log rotation generation $generation is missing" >&2
      exit 75
    }
    stream_file "$candidate" >> "$temporary"
    generation=$((generation - 1))
  done
  cat "$log" >> "$temporary"
fi
mv "$temporary" "$output"
cat "$output"
''']
unavailable_exit_codes = [75]

[[collectors]]
name = "alp"
phase = "after"
transport = "ssh"
command = ["sh", "-c", '''
set -eu
input=/tmp/isuscope-{run_id}.nginx.log
result=/tmp/isuscope-{run_id}.alp.json
trap 'rm -f "$input" "$result"' EXIT
command -v alp >/dev/null 2>&1 || exit 75
test -r "$input" || exit 75
alp ltsv --file "$input" --format json --output count,method,uri,p95 --percentiles 95 --matching-groups '{route_matching_groups}' > "$result"
if test -s "$input"; then
  compact=$(tr -d '[:space:]' < "$result")
  test "$compact" != '[["count","method","uri","p95"]]' || {
    echo 'alp parsed no records from a non-empty access-log delta' >&2
    exit 65
  }
fi
cat "$result"
''']
parser = "alp-json"
unavailable_exit_codes = [75]

# 同じaccess log差分を回収し、local helperが正規化route別の5秒bucketへ変換します。
[[collectors]]
name = "nginx-series"
phase = "after"
transport = "local"
command = ["isuscope", "__transition", "--series-only", "--run-dir", "{run_dir}", "--prefix", "nginx-log-delta-", "--rules", ".isuscope/routes.toml"]
timeout_seconds = 30

[[collectors]]
name = "mysql-log-mark"
phase = "before"
transport = "ssh"
command = ["sh", "-c", '''
set -eu
log=/var/log/mysql/mysql-slow.log
marker=/tmp/isuscope-{run_id}.mysql.marker
command -v sha256sum >/dev/null 2>&1 || exit 75
test -r "$log" || exit 75
offset=$(wc -c < "$log" | tr -d ' ')
sample=$offset
test "$sample" -le 65536 || sample=65536
digest=$(head -c "$sample" "$log" | sha256sum)
prefix=${digest%% *}
printf '%s %s %s\n' "$offset" "$sample" "$prefix" > "$marker"
''']
unavailable_exit_codes = [75]

[[collectors]]
name = "mysql-log-delta"
phase = "after"
transport = "ssh"
command = ["sh", "-c", '''
set -eu
log=/var/log/mysql/mysql-slow.log
marker=/tmp/isuscope-{run_id}.mysql.marker
output=/tmp/isuscope-{run_id}.mysql.log
temporary=$output.tmp
trap 'rm -f "$temporary" "$marker"' EXIT
command -v sha256sum >/dev/null 2>&1 || exit 75
test -r "$log" || exit 75
test -r "$marker" || exit 75
read offset sample prefix < "$marker" || exit 75
case "$offset:$sample" in *[!0-9:]*|:*|*:) exit 75 ;; esac

stream_file() {
  case "$1" in
    *.gz) gzip -cd -- "$1" ;;
    *) cat -- "$1" ;;
  esac
}
pick_generation() {
  plain=$log.$1
  compressed=$plain.gz
  if test -r "$plain"; then
    printf '%s\n' "$plain"
  elif test -r "$compressed" && gzip -t -- "$compressed"; then
    printf '%s\n' "$compressed"
  else
    return 1
  fi
}
matches_marker() {
  size=$(stream_file "$1" | wc -c | tr -d ' ')
  test "$size" -ge "$offset" || return 1
  digest=$(stream_file "$1" | head -c "$sample" | sha256sum)
  test "${digest%% *}" = "$prefix"
}

: > "$temporary"
if matches_marker "$log"; then
  tail -c +$((offset + 1)) "$log" > "$temporary"
else
  origin_generation=0
  for generation in 1 2 3 4 5; do
    if candidate=$(pick_generation "$generation") && matches_marker "$candidate"; then
      origin_generation=$generation
      origin=$candidate
      break
    fi
  done
  if test "$origin_generation" -eq 0; then
    echo 'slow log rotated beyond retained generations or failed fingerprint validation' >&2
    exit 75
  fi
  stream_file "$origin" | tail -c +$((offset + 1)) > "$temporary"
  generation=$((origin_generation - 1))
  while test "$generation" -ge 1; do
    candidate=$(pick_generation "$generation") || {
      echo "slow log rotation generation $generation is missing" >&2
      exit 75
    }
    stream_file "$candidate" >> "$temporary"
    generation=$((generation - 1))
  done
  cat "$log" >> "$temporary"
fi
mv "$temporary" "$output"
cat "$output"
''']
parser = "mysql-slow"
unavailable_exit_codes = [75]

[[collectors]]
name = "slp"
phase = "after"
transport = "ssh"
command = ["sh", "-c", '''
set -eu
input=/tmp/isuscope-{run_id}.mysql.log
result=/tmp/isuscope-{run_id}.slp.tsv
trap 'rm -f "$input" "$result"' EXIT
command -v slp >/dev/null 2>&1 || exit 75
test -r "$input" || exit 75
slp my --file "$input" --format tsv --noheaders --output count,query,sum-query-time,p95-query-time --percentiles 95 > "$result"
if test -s "$input" && ! test -s "$result"; then
  echo 'slp parsed no records from a non-empty slow-log delta' >&2
  exit 65
fi
cat "$result"
''']
parser = "slp-tsv"
unavailable_exit_codes = [75]

# isuscopeが配るcollectorの正本です。`isuscope init`がこのfileを実環境の値で書き出し、
# starter templateの`make discover`は`isuscope init --print config`で同じ内容を取り込みます。
# 実環境に合わせて編集する箇所はSETUP.mdに従ってください。
data_dir = "@@DATA_DIR@@"

[source]
repo = "."
# 計測データ自身をsource snapshotへ再帰的に含めない。
exclude = [".pprotein", "@@DATA_DIR@@"]

[tooling]
# 当日実装したベンチアダプターと問題固有scriptを各runへ保存します。
include = ["benchmark.sh", "parse-benchmark.sh", "fingerprint.sh"]

[observability]
# cgroup v2から軽量に追うsystemd unit。`ISUSCOPE_SERVICE_UNITS`から生成されます。
service_units = [@@SERVICE_UNITS@@]

# Codex・Claude Codeの共通hookが生成する会話履歴と各ベンチを厳密に紐付ける場合だけ有効化します。
# 設定するとagent session/inputを解決できないrunはベンチ開始前に拒否されます。
# [context.agent]
# history_dir = "docs/agent-history"

[benchmark]
mode = "command"
# 当日の起動方法はbenchmark.shだけに実装します。入出力契約は同script冒頭を参照します。
command = [".isuscope/benchmark.sh"]
working_dir = "."
stream_output = false
# 保存した実際のベンチ出力。`isuscope doctor`が全parserをこれに適用して検査します。
@@SAMPLE_OUTPUT@@
# initialize区間と負荷区間の境界になるbenchmark出力の文言。大会ごとに違うため、sampleで`isuscope doctor`が検査します。
# initialize_start_marker = "当日のbenchmarkerがinitialize開始時に出す文言"
# initialize_finish_marker = "当日のbenchmarkerがinitialize完了時に出す文言"

# benchmarkerが運営向けにだけ出す行（ISUCON12は`[ADMIN] ...`）。ここに書いた正規表現に
# 一致する行は保存前に捨てるため、logにもmetricにもparserにも残りません。ルール側の情報を
# 判断に使わないための設定です。当日のbenchmarkerの出力を見て決めます。
# operator_line_pattern = "^\\[ADMIN\\]"

# 問題固有の件数などがbenchmark stdoutに現れる場合に有効化します。
# parserはベンチ終了後に実行され、保存済みrunへ`isuscope enrich`で再適用できます。
# [[benchmark.parsers]]
# name = "contest-output"
# command = [".isuscope/parse-benchmark.sh", "{benchmark_stdout}"]
# timeout_seconds = 30

# `make discover`がこの雛形へGit管理外のSSH・node設定を追加し、
# `.isuscope/config.toml`を生成します。roleを指定しない標準collectorは設定した全nodeで、
# roleを指定したcollectorはそのroleのどれかを持つnodeだけで、run/survey-runの両方に対して動きます。
# perf・off-CPUは`app`、nginx系は`nginx`/`edge`、MySQL系は`db`/`mysql`のnodeが対象です。
# node roleを分けたら、`make discover`で再生成すると対象nodeも追従します。
# SSHは`[ssh] known_hosts_file`で`.local/known-hosts`を使うため、ラッパーを通さない実行でも同じhost keyで接続します。

# Ansible bootstrapで配置した問題固有fingerprintを全nodeから取得します。
[[collectors]]
name = "remote-fingerprint"
phase = "before"
transport = "ssh"
command = ["sh", "-c", "test -x /usr/local/lib/isuscope/fingerprint.sh || exit 75; exec sudo -n /usr/local/lib/isuscope/fingerprint.sh"]
timeout_seconds = 15
unavailable_exit_codes = [75]

# /procだけを使うため、remoteへの追加package導入なしで1秒ごとの基本host時系列を取ります。
[[collectors]]
name = "host-sampler"
phase = "during"
transport = "ssh"
preflight = ["sh", "-c", "a=$(head -n 1 /proc/stat); sleep 1; b=$(head -n 1 /proc/stat); test \"$a\" != \"$b\" && echo /proc/stat advances"]
command = ["sh", "-c", '''
set -eu
read_cpu() { awk '/^cpu / { total=0; for(i=2;i<=9;i++)total+=$i; print $2,$3,$4,$5,$6,$7,$8,$9,total }' /proc/stat; }
# TCPのcounterは/proc/net/snmpと/proc/net/netstatのheader行とvalue行の組から引く。
read_tcp() {
  awk 'FNR%2==1 { split($0, head, /[ \t]+/); next }
       { for (i=2; i<=NF; i++) v[$1 head[i]] = $i }
       END { printf "%d %d %d %d %d %d %d %d\n",
               v["Tcp:PassiveOpens"], v["Tcp:ActiveOpens"], v["Tcp:RetransSegs"],
               v["TcpExt:ListenOverflows"], v["TcpExt:ListenDrops"],
               v["TcpExt:SyncookiesSent"], v["TcpExt:TCPTimeWaitOverflow"],
               v["Tcp:CurrEstab"] }' \
    /proc/net/snmp /proc/net/netstat
}
# TIME_WAITの数。sockstatのinuseは待ち受けsocketも含むので、確立済み接続はsnmpのCurrEstabを使う。
read_sockets() { awk '/^TCP:/ { print $7 }' /proc/net/sockstat; }
# 実際に通信しているNICだけ。仮想deviceの0行でmetricを埋めない。
# /proc/net/devは行頭の空白の数がNIC名の長さで変わるので、空白を落としてから分割する。
read_dev() { awk '{ sub(/^[ \t]+/, ""); n=split($0, f, /[: \t]+/); if (n >= 17 && f[1] != "lo" && f[2] ~ /^[0-9]+$/ && (f[2]+f[10]) > 0) print f[1], f[3], f[2], f[11], f[10] }' /proc/net/dev; }
emit() { printf '{"type":"metric","name":"%s","value":%s,"unit":"%s","timestamp":"%s"}\n' "$1" "$2" "$3" "$ts"; }
# コア別の使用率。全体では余裕があるように見えても、1コアだけ飽和していることがある。
read_cores() { awk '/^cpu[0-9]/ { idle=$5+$6; total=0; for(i=2;i<=9;i++) total+=$i; print $1, total, idle }' /proc/stat; }
# PSI: CPU・memory・I/Oの不足でtaskが足止めされた累積時間(us)。kernelが対応していなければ空。
# 経過時間はkernelのuptimeから1/100秒で取る（forkなし、date +%Nに依存しない）。
# sleep 1は読み取り処理の分だけ延びるので、毎秒値は実測間隔で割る。
read_centis() {
  read -r up _ < /proc/uptime
  frac=${up#*.}
  frac=${frac#0}
  centis=$(( ${up%.*} * 100 + ${frac:-0} ))
}
read_psi() {
  for resource in cpu memory io; do
    test -r /proc/pressure/$resource || continue
    awk -v r="$resource" '{ for (i=2; i<=NF; i++) if ($i ~ /^total=/) { split($i, a, "="); print r "_" $1, a[2] } }' /proc/pressure/$resource
  done
}
emit_dev() { printf '{"type":"metric","name":"%s","value":%s,"unit":"%s","labels":{"device":"%s"},"timestamp":"%s"}\n' "$1" "$2" "$3" "$4" "$ts"; }
set -- $(read_cpu); pu=$1; pn=$2; ps=$3; pd=$4; pw=$5; pq=$6; pr=$7; pv=$8; pt=$9
set -- $(read_tcp); ppo=$1; pao=$2; prs=$3; plo=$4; pld=$5; psc=$6; ptw=$7
dev_previous=$(read_dev)
cores_previous=$(read_cores)
psi_previous=$(read_psi)
read_centis; previous_centis=$centis
while :; do
  sleep 1
  read_centis; dt_cs=$(( centis - previous_centis )); previous_centis=$centis
  # 時計が戻ったり、負荷でsamplerが長く止まった場合は毎秒値を出さない。
  [ "$dt_cs" -ge 50 ] && [ "$dt_cs" -le 6000 ] || dt_cs=0
  set -- $(read_cpu); u=$1; n=$2; s=$3; d=$4; w=$5; q=$6; r=$7; v=$8; t=$9
  set -- $(awk -v dt=$((t-pt)) -v u=$((u-pu)) -v n=$((n-pn)) -v s=$((s-ps+q-pq+r-pr)) -v d=$((d-pd)) -v w=$((w-pw)) -v v=$((v-pv)) -v q=$((r-pr)) 'BEGIN { if(dt<=0)dt=1; printf "%.6f %.6f %.6f %.6f %.6f %.6f %.6f %.6f",100*u/dt,100*n/dt,100*s/dt,100*w/dt,100*v/dt,100*d/dt,100*(dt-d-w)/dt,100*q/dt }')
  user=$1; nice=$2; system=$3; iowait=$4; steal=$5; idle=$6; busy=$7; softirq=$8
  mem=$(awk '/MemTotal:/{t=$2}/MemAvailable:/{a=$2}END{print (t-a)*1024}' /proc/meminfo)
  load=$(awk '{print $1}' /proc/loadavg); ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
  for item in host.cpu_user_percent:$user host.cpu_nice_percent:$nice host.cpu_system_percent:$system host.cpu_iowait_percent:$iowait host.cpu_steal_percent:$steal host.cpu_idle_percent:$idle host.cpu_busy_percent:$busy host.cpu_percent:$busy host.cpu_softirq_percent:$softirq; do
    name=${item%%:*}; value=${item#*:}; emit "$name" "$value" percent
  done
  emit host.memory_used_bytes "$mem" bytes
  emit host.load1 "$load" load
  # コア別。busyが1コアだけ高いなら、全体の余裕は当てにならない。
  cores_current=$(read_cores)
  printf '%s\n---\n%s\n' "$cores_previous" "$cores_current" | awk 'BEGIN { first = 1 }
    /^---$/ { first = 0; next }
    first { total[$1] = $2; idle[$1] = $3; next }
    ($1 in total) { dt = $2 - total[$1]; di = $3 - idle[$1]; if (dt > 0) { busy = 100 * (dt - di) / dt; if (busy > peak) peak = busy; printf "core %s %.3f\n", substr($1, 4), busy } }
    END { if (peak != "") printf "peak %s %.3f\n", "-", peak }' |
  while read -r kind core value; do
    if [ "$kind" = core ]; then
      printf '{"type":"metric","name":"host.core_busy_percent","value":%s,"unit":"percent","labels":{"core":"%s"},"timestamp":"%s"}\n' "$value" "$core" "$ts"
    else
      emit host.core_busy_max_percent "$value" percent
    fi
  done
  cores_previous=$cores_current
  # PSIは累積usなので区間差分を秒あたりの割合(%)にする。
  psi_current=$(read_psi)
  test "$dt_cs" -gt 0 && printf '%s\n---\n%s\n' "$psi_previous" "$psi_current" | awk -v dt="$dt_cs" 'BEGIN { first = 1 }
    /^---$/ { first = 0; next }
    first { previous[$1] = $2; next }
    ($1 in previous) { printf "%s %.3f\n", $1, ($2 - previous[$1]) / (100 * dt) }' |
  while read -r name value; do
    emit "host.psi_${name}_percent" "$value" percent
  done
  psi_previous=$psi_current
  # 接続の受け付けと保持。0が続くなら、接続の取りこぼしはサーバー側ではない。
  set -- $(read_tcp); po=$1; ao=$2; rs=$3; lo=$4; ld=$5; sc=$6; tw=$7; established=$8
  # 毎秒値は小数で出す（整数で割ると、1.01秒に1件の取りこぼしが0件/秒になる）。取りこぼし系は
  # 区間の件数もそのまま残す。件数は間隔が測れなかった区間でも正しいので、毎回出す。
  echo "$((po-ppo)) $((ao-pao)) $((rs-prs)) $((lo-plo)) $((ld-pld)) $((sc-psc)) $((tw-ptw))" |
  awk -v dt="$dt_cs" '{
    split("tcp_passive_opens tcp_active_opens tcp_retransmit_segments tcp_listen_overflows tcp_listen_drops tcp_syn_cookies_sent tcp_time_wait_overflow", name, " ")
    split("connections connections segments connections connections connections connections", unit, " ")
    for (i = 1; i <= 7; i++) {
      if (i >= 3) printf "host.%s %d %s\n", name[i], $i, unit[i]
      if (dt > 0) printf "host.%s_per_second %.3f %s\n", name[i], $i * 100 / dt, unit[i]
    }
  }' |
  while read -r name value unit; do emit "$name" "$value" "$unit"; done
  ppo=$po; pao=$ao; prs=$rs; plo=$lo; pld=$ld; psc=$sc; ptw=$tw
  emit host.tcp_established "$established" connections
  set -- $(read_sockets)
  if [ $# -ge 1 ]; then emit host.tcp_time_wait "$1" connections; fi
  dev_current=$(read_dev)
  printf '%s\n' "$dev_current" | while read -r nic rxp rxb txp txb; do
    [ -n "${nic:-}" ] || continue
    previous=$(printf '%s\n' "$dev_previous" | awk -v nic="$nic" '$1==nic { print $2, $3, $4, $5 }')
    set -- ${previous:-}
    [ $# -eq 4 ] || continue
    [ "$dt_cs" -gt 0 ] || continue
    set -- $(awk -v dt="$dt_cs" -v a=$((rxp-$1)) -v b=$((rxb-$2)) -v c=$((txp-$3)) -v d=$((txb-$4)) 'BEGIN { printf "%.3f %.3f %.3f %.3f", a * 100 / dt, b * 100 / dt, c * 100 / dt, d * 100 / dt }')
    emit_dev host.net_rx_packets_per_second "$1" packets "$nic"
    emit_dev host.net_rx_bytes_per_second "$2" bytes "$nic"
    emit_dev host.net_tx_packets_per_second "$3" packets "$nic"
    emit_dev host.net_tx_bytes_per_second "$4" bytes "$nic"
  done
  dev_previous=$dev_current
  pu=$u; pn=$n; ps=$s; pd=$d; pw=$w; pq=$q; pr=$r; pv=$v; pt=$t
done
''']

[[collectors]]
name = "sysstat"
phase = "during"
transport = "ssh"
command = ["sh", "-c", "command -v sar >/dev/null 2>&1 || exit 75; exec env LC_ALL=C TZ=UTC sar -u -d 1"]
parser = "sysstat"
unavailable_exit_codes = [75]

# 指定した少数のsystemd unitだけをcgroup v2から読み、CPU・memory・I/Oを1秒粒度で記録します。
[[collectors]]
name = "service-sampler"
phase = "during"
transport = "ssh"
command = ["sh", "-c", '''
set -eu
units='{service_units}'
test -n "$units" || exit 75
test -r /sys/fs/cgroup/cgroup.controllers || exit 75
command -v systemctl >/dev/null 2>&1 || exit 75
map=/tmp/isuscope-{run_id}.service-cgroups
trap 'rm -f "$map"' EXIT
trap 'exit 0' HUP INT TERM
: > "$map"
for unit in $units; do
  cgroup=$(systemctl show "$unit" --property=ControlGroup --value 2>/dev/null || true)
  test -n "$cgroup" || continue
  base=/sys/fs/cgroup$cgroup
  test -r "$base/cpu.stat" -a -r "$base/memory.current" -a -r "$base/pids.current" || continue
  printf '%s\t%s\n' "$unit" "$base" >> "$map"
done
test -s "$map" || exit 75
while :; do
  ts=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)
  tab=$(printf '\t')
  while IFS="$tab" read -r unit base; do
    cpu=$(awk '$1=="usage_usec"{print $2}' "$base/cpu.stat")
    memory=$(cat "$base/memory.current")
    pids=$(cat "$base/pids.current")
    set -- $(awk '{for(i=2;i<=NF;i++){split($i,a,"="); if(a[1]=="rbytes")r+=a[2]; if(a[1]=="wbytes")w+=a[2]}} END{print r+0,w+0}' "$base/io.stat" 2>/dev/null || echo '0 0')
    printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$ts" "$unit" "$cpu" "$memory" "$1" "$2" "$pids"
  done < "$map"
  sleep 1
done
''']
parser = "service-cgroup"
unavailable_exit_codes = [75]

[[collectors]]
# CPU割当の上限で止められた時間。CPU使用率が低いのに遅い場合の原因になる。
name = "service-throttle"
phase = "during"
transport = "ssh"
command = ["sh", "-c", '''
set -eu
units='{service_units}'
test -n "$units" || exit 75
test -r /sys/fs/cgroup/cgroup.controllers || exit 75
command -v systemctl >/dev/null 2>&1 || exit 75
map=/tmp/isuscope-{run_id}.service-throttle
trap 'rm -f "$map"' EXIT
trap 'exit 0' HUP INT TERM
: > "$map"
for unit in $units; do
  cgroup=$(systemctl show "$unit" --property=ControlGroup --value 2>/dev/null || true)
  test -n "$cgroup" || continue
  base=/sys/fs/cgroup$cgroup
  test -r "$base/cpu.stat" || continue
  # 上限が無いcgroupのthrottleは0のまま出る。割当量（cpu_quota_cores）は上限があるunitだけ出す。
  printf '%s\t%s\n' "$unit" "$base" >> "$map"
done
test -s "$map" || exit 75
emit() { printf '{"type":"metric","name":"%s","value":%s,"unit":"%s","labels":{"service":"%s"},"timestamp":"%s"}\n' "$1" "$2" "$3" "$4" "$ts"; }
read_throttle() { awk '$1=="nr_throttled"{n=$2} $1=="throttled_usec"{t=$2} END{print n+0, t+0}' "$1/cpu.stat"; }
# 経過時間は/proc/uptimeから1/100秒で取り、率はその実測間隔で割る（host-samplerと同じ）。
read_centis() {
  read -r up _ < /proc/uptime
  frac=${up#*.}
  frac=${frac#0}
  centis=$(( ${up%.*} * 100 + ${frac:-0} ))
}
tab=$(printf '\t')
previous=$(while IFS="$tab" read -r unit base; do printf '%s %s\n' "$unit" "$(read_throttle "$base")"; done < "$map")
read_centis; previous_centis=$centis
while :; do
  sleep 1
  read_centis; dt_cs=$(( centis - previous_centis )); previous_centis=$centis
  ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
  current=$(while IFS="$tab" read -r unit base; do printf '%s %s\n' "$unit" "$(read_throttle "$base")"; done < "$map")
  [ "$dt_cs" -ge 50 ] && [ "$dt_cs" -le 6000 ] || { previous=$current; continue; }
  printf '%s\n---\n%s\n' "$previous" "$current" | awk -v dt="$dt_cs" 'BEGIN { first = 1 }
    /^---$/ { first = 0; next }
    first { periods[$1] = $2; usec[$1] = $3; next }
    ($1 in periods) { printf "%s %.3f %.3f\n", $1, ($2 - periods[$1]) * 100 / dt, ($3 - usec[$1]) / (100 * dt) }' |
  while read -r unit periods percent; do
    emit service.cpu_throttled_periods_per_second "$periods" periods "$unit"
    emit service.cpu_throttled_percent "$percent" percent "$unit"
  done
  while IFS="$tab" read -r unit base; do
    quota=$(awk '{ if ($1 == "max") print ""; else printf "%.3f", $1 / $2 }' "$base/cpu.max" 2>/dev/null || true)
    test -n "$quota" || continue
    emit service.cpu_quota_cores "$quota" cores "$unit"
  done < "$map"
  previous=$current
done
''']
unavailable_exit_codes = [75]

[[collectors]]
name = "perf-start"
phase = "before"
transport = "ssh"
roles = ["app"]
command = ["sh", "-c", '''
set -eu
base=/tmp/isuscope-{run_id}.perf
command -v perf >/dev/null 2>&1 || exit 75
command -v sudo >/dev/null 2>&1 || exit 75
sudo -n true >/dev/null 2>&1 || exit 75
# 引数は追加のperf record option（空でよい）。perfは受け付けないoptionですぐ終わるので、
# 起動を確かめた後も少し待って生きていることを見る。
start_perf() {
  sudo -n rm -f "$base.data" "$base.log" "$base.pid"
  sudo -n sh -c 'nohup env LC_ALL=C perf record $2 -a -g -F 99 -o "$1.data" -- sleep 86400 >"$1.log" 2>&1 & echo $! >"$1.pid"' sh "$base" "$1"
  i=0
  while :; do
    pid=$(sudo -n cat "$base.pid" 2>/dev/null) || return 1
    case $pid in ''|*[!0-9]*) return 1 ;; esac
    if sudo -n kill -0 "$pid" 2>/dev/null; then
      sleep 0.3
      sudo -n kill -0 "$pid" 2>/dev/null
      return
    fi
    i=$((i+1))
    test "$i" -lt 20 || return 1
    sleep 0.1
  done
}
# perfの時刻をCLOCK_MONOTONIC（/proc/uptimeと同じ基準）に固定し、壁時計との差を残す。
# 既定の時計はNTPで補正されないので、起動から日数が経つと壁時計から数秒ずれる。
# 対応しないperfでは従来どおり、最初のsampleを起点にした相対時刻へ戻す。
wall=$(date +%s.%N)
uptime=$(cut -d' ' -f1 /proc/uptime)
clock=monotonic
if ! start_perf "-k monotonic"; then
  clock=legacy
  wall=$(date +%s.%N)
  uptime=$(cut -d' ' -f1 /proc/uptime)
  start_perf "" || { sudo -n cat "$base.log" >&2 || true; exit 75; }
fi
printf '%s %s %s\n' "$wall" "$uptime" "$clock" > "$base.start"
''']
timeout_seconds = 15
unavailable_exit_codes = [75]

[[collectors]]
name = "perf-stop"
phase = "after"
transport = "ssh"
roles = ["app"]
command = ["sh", "-c", "set -eu; base=/tmp/isuscope-{run_id}.perf; command -v sudo >/dev/null 2>&1 || exit 75; sudo -n true >/dev/null 2>&1 || exit 75; pid=$(sudo -n cat \"$base.pid\" 2>/dev/null) || exit 75; case $pid in ''|*[!0-9]*) exit 75 ;; esac; sudo -n kill -INT \"$pid\" 2>/dev/null || exit 75; i=0; while sudo -n kill -0 \"$pid\" 2>/dev/null; do i=$((i+1)); if test \"$i\" -ge 100; then sudo -n cat \"$base.log\" >&2 || true; exit 1; fi; sleep 0.1; done; sudo -n test -s \"$base.data\" || exit 75; sudo -n rm -f \"$base.pid\""]
timeout_seconds = 20
unavailable_exit_codes = [75]

[[collectors]]
name = "perf-flamegraph"
phase = "after"
transport = "ssh"
# perf.dataをもう一度読み直す2つ目のpassなので、通常のrunでは作らない。人が見る図で、
# 数値（run全体と5秒ごとのsymbol別の割合）はperf-seriesの1回の読み取りで足りる。
# 必要なときはmodesへ"run"を足す。
modes = ["survey-run"]
roles = ["app"]
command = ["sh", "-c", '''
set -eu
base=/tmp/isuscope-{run_id}.perf
script=$base.script
folded=$base.folded
trap 'rm -f "$script" "$folded"' EXIT
command -v perf >/dev/null 2>&1 || exit 75
command -v stackcollapse-perf.pl >/dev/null 2>&1 || exit 75
command -v flamegraph.pl >/dev/null 2>&1 || exit 75
command -v sudo >/dev/null 2>&1 || exit 75
sudo -n test -s "$base.data" || exit 75
sudo -n env LC_ALL=C perf script -i "$base.data" > "$script"
stackcollapse-perf.pl "$script" > "$folded"
test -s "$folded" || exit 75
flamegraph.pl --title "isuscope CPU Flame Graph" --countname samples "$folded"
''']
timeout_seconds = 60
max_output_bytes = 33554432
unavailable_exit_codes = [75]

[[collectors]]
name = "perf-series"
phase = "after"
transport = "ssh"
roles = ["app"]
command = ["sh", "-c", '''
base=/tmp/isuscope-{run_id}.perf
cleanup() { sudo -n rm -f "$base.data" "$base.log" "$base.pid" >/dev/null 2>&1 || true; rm -f "$base.start"; }
trap cleanup EXIT
command -v perf >/dev/null 2>&1 || exit 75
command -v sudo >/dev/null 2>&1 || exit 75
sudo -n true >/dev/null 2>&1 || exit 75
sudo -n test -s "$base.data" || exit 75
test -s "$base.start" || exit 75
read -r wall uptime clock < "$base.start" || exit 75
if [ "${clock:-}" = monotonic ]; then
  # sampleの時刻はCLOCK_MONOTONIC。壁時計との差からparserが絶対時刻へ直す。
  printf '# isuscope-perf-clock %s %s\n' "$wall" "$uptime"
  sudo -n env LC_ALL=C perf script -G --ns -F comm,time,event,ip,sym,dso -i "$base.data"
else
  printf '# isuscope-perf-start %s\n' "$wall"
  sudo -n env LC_ALL=C perf script -G --reltime --ns -F comm,time,event,ip,sym,dso -i "$base.data"
fi
''']
parser = "perf-script"
timeout_seconds = 30
unavailable_exit_codes = [75]

[[collectors]]
name = "offcpu-start"
phase = "before"
transport = "ssh"
roles = ["app"]
command = ["sh", "-c", '''
set -eu
base=/tmp/isuscope-{run_id}.offcpu
command -v offcputime-bpfcc >/dev/null 2>&1 || exit 75
command -v python3 >/dev/null 2>&1 || exit 75
command -v sudo >/dev/null 2>&1 || exit 75
sudo -n true >/dev/null 2>&1 || exit 75
sudo -n env LC_ALL=C offcputime-bpfcc -f 1 >/dev/null 2>&1 || exit 75
sudo -n python3 -c 'import subprocess, sys; base=sys.argv[1]; out=open(base+".out", "wb"); err=open(base+".err", "wb"); p=subprocess.Popen(["env", "LC_ALL=C", "offcputime-bpfcc", "-f", "86400"], stdout=out, stderr=err, start_new_session=True); open(base+".pid", "w").write(str(p.pid))' "$base"
sudo -n test -s "$base.pid"
''']
timeout_seconds = 15
unavailable_exit_codes = [75]

[[collectors]]
name = "offcpu"
phase = "after"
transport = "ssh"
roles = ["app"]
command = ["sh", "-c", '''
set -eu
base=/tmp/isuscope-{run_id}.offcpu
cleanup() { sudo -n rm -f "$base.pid" "$base.out" "$base.err" >/dev/null 2>&1 || true; }
trap cleanup EXIT
command -v sudo >/dev/null 2>&1 || exit 75
sudo -n true >/dev/null 2>&1 || exit 75
pid=$(sudo -n cat "$base.pid" 2>/dev/null) || exit 75
case $pid in ''|*[!0-9]*) exit 75 ;; esac
sudo -n kill -INT -- "-$pid" 2>/dev/null || exit 75
i=0
while sudo -n kill -0 "$pid" 2>/dev/null; do
  i=$((i+1))
  test "$i" -lt 200 || { sudo -n cat "$base.err" >&2 || true; exit 1; }
  sleep 0.1
done
sudo -n test -s "$base.out" || exit 75
sudo -n cat "$base.out"
''']
timeout_seconds = 30
max_output_bytes = 33554432
unavailable_exit_codes = [75]

# alp/slpはログ形式とpathが問題ごとに異なるため、docs/initial-automation.mdに従い以下の
# placeholderを実環境へ合わせます。設定から削除せず、対象がなければ75を返します。
[[collectors]]
name = "nginx-log-mark"
phase = "before"
transport = "ssh"
roles = ["nginx", "edge"]
preflight = ["sh", "-c", "command -v sha256sum >/dev/null || { echo sha256sum missing; exit 1; }; test -r @@NGINX_ACCESS_LOG@@ && echo readable @@NGINX_ACCESS_LOG@@"]
command = ["sh", "-c", '''
set -eu
log=@@NGINX_ACCESS_LOG@@
marker=/tmp/isuscope-{run_id}.nginx.marker
command -v sha256sum >/dev/null 2>&1 || exit 75
test -r "$log" || exit 75
offset=$(wc -c < "$log" | tr -d ' ')
# 前回までの差分は回収済み。上限を超えたログは空にしてnodeのdiskを守る
# (nginxはO_APPENDで書くので、次の行はfileの先頭から入る)。
limit=1073741824
if test "$offset" -gt "$limit" && sudo -n truncate -s 0 "$log" 2>/dev/null; then
  echo "truncated $log after it exceeded $limit bytes" >&2
  offset=$(wc -c < "$log" | tr -d ' ')
fi
sample=$offset
test "$sample" -le 65536 || sample=65536
digest=$(head -c "$sample" "$log" | sha256sum)
prefix=${digest%% *}
printf '%s %s %s\n' "$offset" "$sample" "$prefix" > "$marker"
''']
unavailable_exit_codes = [75]

[[collectors]]
name = "nginx-log-delta"
phase = "after"
transport = "ssh"
roles = ["nginx", "edge"]
command = ["sh", "-c", '''
set -eu
log=@@NGINX_ACCESS_LOG@@
marker=/tmp/isuscope-{run_id}.nginx.marker
output=/tmp/isuscope-{run_id}.nginx.log
temporary=$output.tmp
trap 'rm -f "$temporary" "$marker"' EXIT
command -v sha256sum >/dev/null 2>&1 || exit 75
test -r "$log" || exit 75
test -r "$marker" || exit 75
read offset sample prefix < "$marker" || exit 75
case "$offset:$sample" in *[!0-9:]*|:*|*:) exit 75 ;; esac

stream_file() {
  case "$1" in
    *.gz) gzip -cd -- "$1" ;;
    *) cat -- "$1" ;;
  esac
}
pick_generation() {
  plain=$log.$1
  compressed=$plain.gz
  if test -r "$plain"; then
    printf '%s\n' "$plain"
  elif test -r "$compressed" && gzip -t -- "$compressed"; then
    printf '%s\n' "$compressed"
  else
    return 1
  fi
}
# 非圧縮の世代は大きさをmetadataから取る（`wc -c`は通常fileならfstatで済み、過去分を読み流さない）。
file_size() {
  case "$1" in
    *.gz) stream_file "$1" | wc -c | tr -d ' ' ;;
    *) wc -c < "$1" | tr -d ' ' ;;
  esac
}
matches_marker() {
  size=$(file_size "$1")
  test "$size" -ge "$offset" || return 1
  digest=$(stream_file "$1" | head -c "$sample" | sha256sum)
  test "${digest%% *}" = "$prefix"
}

: > "$temporary"
if matches_marker "$log"; then
  tail -c +$((offset + 1)) "$log" > "$temporary"
else
  origin_generation=0
  for generation in 1 2 3 4 5; do
    if candidate=$(pick_generation "$generation") && matches_marker "$candidate"; then
      origin_generation=$generation
      origin=$candidate
      break
    fi
  done
  if test "$origin_generation" -eq 0; then
    echo 'access log rotated beyond retained generations or failed fingerprint validation' >&2
    exit 75
  fi
  stream_file "$origin" | tail -c +$((offset + 1)) > "$temporary"
  generation=$((origin_generation - 1))
  while test "$generation" -ge 1; do
    candidate=$(pick_generation "$generation") || {
      echo "access log rotation generation $generation is missing" >&2
      exit 75
    }
    stream_file "$candidate" >> "$temporary"
    generation=$((generation - 1))
  done
  cat "$log" >> "$temporary"
fi
mv "$temporary" "$output"
# 差分はこのnodeに置いたまま、後のalpが集計する。ここでは大きさだけを残す。
printf '{"type":"metric","name":"http.access_log_bytes","value":%s,"unit":"bytes"}\n' "$(wc -c < "$output" | tr -d ' ')"
''']
unavailable_exit_codes = [75]

# survey-runでは、区間ごとの集計に加えて生のaccess logも持ち帰る。行動遷移を作るためと、
# 後から別の観点で掘り直すためで、通常のrunでは運ばない（1 nodeで1 runあたり数百MBになる）。
[[collectors]]
name = "nginx-log-raw"
phase = "after"
transport = "ssh"
roles = ["nginx", "edge"]
modes = ["survey-run"]
command = ["sh", "-c", "input=/tmp/isuscope-{run_id}.nginx.log; test -r \"$input\" || exit 75; cat \"$input\""]
max_output_bytes = 1073741824
unavailable_exit_codes = [75]

# access logの差分を、node上でroute別に集計する。生のlogを運ばないので、1 nodeあたりの
# 転送は数十KBで済む。alpはAnsibleのobservability roleが入れる前提で、無ければ失敗させる
# （黙ってHTTPの計測が欠けないように）。
# - route別の集計（回数・status・合計・平均・min/max・p50/p95/p99・bytes）は差分全体をalpで。
# - route別の5秒ごとの回数・error・p50/p95/p99は、ベンチの区間を5秒ごとのfileに分けてalpで。
# - ベンチ側の接続の使い方（同時接続数、新規接続、応答から次の要求までの間隔、接続あたりの
#   要求数）とupstream別の回数・retry・connect/header/response時間は、同じawkの読み取りで。
#   分位点は値をsortして取る（mawkにはasortが無い）。
# 時刻は`$msec`（応答を返し終えたepoch秒）、接続は`$connection`と`$connection_requests`、
# upstreamは`$upstream_addr`、`$upstream_connect_time`、`$upstream_header_time`、
# `$upstream_response_time`をLTSVのfieldとして読む。無いfieldの値は出さない。
# upstream別の値は試行単位で、要求数は試行数、retryはその接続先で失敗して次へ回された試行。
[[collectors]]
name = "alp"
phase = "after"
transport = "ssh"
roles = ["nginx", "edge"]
preflight = ["sh", "-c", "command -v alp >/dev/null 2>&1 || { echo 'alp is not installed; install it with the Ansible observability role'; exit 1; }; echo alp available"]
command = ["sh", "-c", '''
set -eu
input=/tmp/isuscope-{run_id}.nginx.log
work=/tmp/isuscope-{run_id}.alp
trap 'rm -rf "$input" "$work"' EXIT
test -r "$input" || exit 75
command -v alp >/dev/null 2>&1 || { echo 'alp is not installed on this node; install it with the Ansible observability role' >&2; exit 1; }
mkdir -p "$work"
awk -F '\t' -v begin='{benchmark_started_at}' -v end='{benchmark_finished_at}' -v dir="$work" '
  function metric(name, value, unit, labels, at) {
    printf "{\"type\":\"metric\",\"name\":\"%s\",\"value\":%.6f,\"unit\":\"%s\",\"labels\":{%s}", name, value, unit, labels
    if (at != "") printf ",\"timestamp\":%d", at
    printf "}\n"
  }
  # nginxはupstreamへの試行を、addressと各時間の変数に同じ並びで記録する（retryは`, `、
  # 別のupstreamへ回ったときは` : `で区切る）。値の無い試行は`-`。
  function attempts(raw, parts,   count, i) {
    gsub(/ : /, ",", raw)
    count = split(raw, parts, ",")
    for (i = 1; i <= count; i++) gsub(/^ +| +$/, "", parts[i])
    return count
  }
  function sample(key, value) { if (value != "") printf "%s\t%.6f\n", key, value > (dir "/samples") }
  /^[ \t]*$/ { next }
  {
    lines++
    delete field
    for (i = 1; i <= NF; i++) { at = index($i, ":"); if (at) field[substr($i, 1, at - 1)] = substr($i, at + 1) }
    if (!("method" in field) || !("uri" in field)) next
    parsed++
    if (field["msec"] !~ /^[0-9]+(\.[0-9]+)?$/) next
    at = field["msec"] + 0
    if ((begin != "" && at < begin + 0) || (end != "" && at > end + 0)) next
    bucket = int(at / 5) * 5
    print > (dir "/" bucket ".bucket")
    if (field["conn"] != "" && field["reqtime"] ~ /^[0-9.]+$/) {
      id = field["conn"]; start = at - field["reqtime"]
      if (id in last) {
        # 同じ接続の中でも記録の順は前後するので、外側の端だけを持つ。
        gap = (start - last[id]) * 1000
        if (gap >= 0) sample("g" bucket, gap)
        if (start < first[id]) first[id] = start
        if (at > last[id]) last[id] = at
        requests[id]++
      } else {
        first[id] = start; last[id] = at; requests[id] = 1; opened[bucket]++
      }
    }
    # 時間は試行ごとにその接続先へ付ける。Aで1秒待って失敗しBで20 msで返ったなら、
    # Aに1,000 ms、Bに20 ms（要求全体の時間はroute別の`http.request_duration`にある）。
    count = attempts(field["upstream_addr"], addresses)
    attempts(field["upstream_connect"], connects)
    attempts(field["upstream_header"], headers)
    attempts(field["apptime"], responses)
    for (i = 1; i <= count; i++) {
      address = addresses[i]; gsub(/["\\]/, "_", address)
      if (address == "" || address == "-") continue
      upstreams[address]++
      # 最後でない試行は、その接続先で失敗して次へ回されたもの。
      if (i < count) retried[address]++
      if (connects[i] ~ /^[0-9.]+$/) sample("c" address, connects[i] * 1000)
      if (headers[i] ~ /^[0-9.]+$/) sample("h" address, headers[i] * 1000)
      if (responses[i] ~ /^[0-9.]+$/) sample("r" address, responses[i] * 1000)
    }
  }
  END {
    print lines + 0, parsed + 0 > (dir "/counts")
    # 同時接続数は、各接続の最初の要求から最後の応答までを5秒ごとに積む（遊休中の保持は入らない）。
    for (id in first) {
      start = first[id]
      while (1) {
        bucket = int(start / 5) * 5; stop = last[id] < bucket + 5 ? last[id] : bucket + 5
        if (stop > start) busy[bucket] += stop - start
        if (stop >= last[id]) break
        start = stop
      }
      connections++; total += requests[id]; if (requests[id] > most) most = requests[id]
    }
    for (bucket in busy) metric("client.connections_in_use", busy[bucket] / 5, "connections", "", bucket)
    for (bucket in opened) metric("client.connections_opened", opened[bucket], "connections", "", bucket)
    if (connections) {
      metric("client.connection_requests_mean", total / connections, "requests", "", "")
      metric("client.connection_requests_max", most, "requests", "", "")
      metric("client.connections_opened_total", connections, "connections", "", "")
    }
    for (address in upstreams) {
      label = "\"upstream\":\"" address "\""
      metric("http.upstream_requests", upstreams[address], "requests", label, "")
      if (address in retried) metric("http.upstream_retried_requests", retried[address], "requests", label, "")
    }
  }' "$input"
read lines parsed < "$work/counts"
# 行はあるのにmethodとuriを1件も読めなければ、log formatと設定が合っていない。
if [ "$lines" -gt 0 ] && [ "$parsed" = 0 ]; then
  echo "none of $lines access-log lines had the method and uri fields" >&2
  exit 65
fi
if [ -s "$work/samples" ]; then
  LC_ALL=C sort -t "$(printf '\t')" -k1,1 -k2,2n "$work/samples" | awk -F '\t' '
    function metric(name, value, labels, at) {
      printf "{\"type\":\"metric\",\"name\":\"%s\",\"value\":%.6f,\"unit\":\"ms\",\"labels\":{%s}", name, value, labels
      if (at != "") printf ",\"timestamp\":%d", at
      printf "}\n"
    }
    function rank(q,   r, i) { r = q * n; i = int(r); if (i < r) i++; return i < 1 ? 1 : i }
    function flush(   kind, rest, name, labels, at, i, sum, q) {
      if (n == 0) return
      kind = substr(key, 1, 1); rest = substr(key, 2); labels = ""; at = ""
      if (kind == "g") { name = "client.request_gap"; at = rest }
      else {
        name = kind == "c" ? "http.upstream_connect_duration" : kind == "h" ? "http.upstream_header_duration" : "http.upstream_response_duration"
        labels = "\"upstream\":\"" rest "\""
        for (i = 1; i <= n; i++) sum += value[i]
        metric(name "_sum", sum, labels, ""); metric(name "_mean", sum / n, labels, "")
        metric(name "_min", value[1], labels, ""); metric(name "_max", value[n], labels, "")
      }
      split("0.50 0.95 0.99", q, " ")
      for (i = 1; i <= 3; i++) {
        sep = labels == "" ? "" : ","
        metric(name, value[rank(q[i] + 0)], labels sep "\"quantile\":\"" q[i] "\"", at)
      }
      n = 0
    }
    $1 != key { flush(); key = $1 }
    { value[++n] = $2 + 0 }
    END { flush() }'
fi
# route別の集計は差分全体で1回、時系列は5秒ごとのfileごとに1回、alpで作る。
# alpは`apptime`（upstreamの時間）があればそちらを使うので、`reqtime`（`$request_time`）を渡す。
summarize() {
  alp ltsv --file "$1" --format json --apptime-label reqtime \
    --output count,1xx,2xx,3xx,4xx,5xx,method,uri,min,max,sum,avg,p50,p95,p99,sum_body \
    --percentiles 50,95,99 --matching-groups '{route_matching_groups}' | tr -d '\n'
}
printf 'whole\t%s\n' "$(summarize "$input")"
for file in "$work"/*.bucket; do
  test -e "$file" || continue
  bucket=${file##*/}
  printf '%s\t%s\n' "${bucket%.bucket}" "$(summarize "$file")"
done
''']
parser = "alp-windows"
timeout_seconds = 120
unavailable_exit_codes = [75]

# survey-runでは、持ち帰った生のaccess logからsession/viewer単位の遷移を作ります。
# session field名は環境のLTSVに合わせて必要ならcommandへ`--session-field`を追加します。
[[collectors]]
name = "user-transition"
phase = "after"
transport = "local"
modes = ["survey-run"]
command = ["isuscope", "__transition", "--run-dir", "{run_dir}", "--prefix", "nginx-log-raw-", "--rules", ".isuscope/routes.toml"]
timeout_seconds = 30

# 得点が「リクエスト数×重み」で決まらない問題（ISUCON13のtip合計など）では、得点の源に
# なっている値を自分のシステムから読みます。ベンチ側には触れません。負荷走行で何が増えるかを
# 特定するための調査なので、survey-runのときだけ動かします。
# 値は`score.`で始まるmetricとして出すと、briefの`score_inputs`に並びます。
# [[collectors]]
# name = "score-probe"
# phase = "after"
# transport = "ssh"
# roles = ["db"]
# modes = ["survey-run"]
# command = ["sh", "-c", '''
# set -eu
# command -v mysql >/dev/null 2>&1 || exit 75
# command -v sudo >/dev/null 2>&1 || exit 75
# # 当日の問題に合わせて、得点の源になりそうな値を数える。複数行を出してよい。
# sudo -n mysql -N -B isucon -e '
#   SELECT "score.tip_total", IFNULL(SUM(tip), 0) FROM livecomments;
#   SELECT "score.completed_rides", COUNT(*) FROM rides WHERE status = "COMPLETED";
# ' 2>/dev/null |
# while read -r name value; do
#   printf '{"type":"metric","name":"%s","value":%s,"unit":"points"}\n' "$name" "$value"
# done
# ''']
# unavailable_exit_codes = [75]

# 最初のsurvey-runで通常HTTPのrequest/response bodyを全件保存したい場合だけ有効化します。
# 得点が「どの値の和か」を実データから当てるためのもので、点数表が公開されていれば不要です。
# benchmark.shが`ISUSCOPE_RUN_MODE=survey-run`のときだけ接続先を127.0.0.1:18080へ向け、
# ここのupstreamを実applicationに合わせます（通常のrunは中継を通しません）。
# SSE、WebSocket、HTTPS upstreamには対応せず、response bufferingによる観測負荷があります。
# [[collectors]]
# name = "discovery-http"
# phase = "during"
# transport = "local"
# modes = ["survey-run"]
# command = ["isuscope", "__discovery-capture", "--listen", "127.0.0.1:18080", "--upstream", "http://127.0.0.1:8080", "--max-body-bytes", "1048576", "--session-cookie", "session"]
# ISUSCOPE_DISCOVERY_SESSION_KEYはisuscope起動前に環境変数で渡し、configへ秘密値を書きません。

[[collectors]]
# SQLが遅い理由の切り分け用。実行中thread、行lock待ち、log flush待ち、buffer poolの読み込みを
# 2秒ごとに見る。累積counterは区間差分、現在値はそのまま。Performance Schemaは使わない。
name = "mysql-status"
phase = "during"
transport = "ssh"
roles = ["db", "mysql"]
command = ["sh", "-c", '''
set -eu
command -v mysql >/dev/null 2>&1 || exit 75
command -v sudo >/dev/null 2>&1 || exit 75
status() { sudo -n mysql -N -B -e 'SHOW GLOBAL STATUS' 2>/dev/null; }
test -n "$(status)" || exit 75
trap 'exit 0' HUP INT TERM
# `SHOW GLOBAL STATUS`自体に時間がかかるので、率は実測間隔（/proc/uptime、1/100秒）で割る。
read_centis() {
  read -r up _ < /proc/uptime
  frac=${up#*.}
  frac=${frac#0}
  centis=$(( ${up%.*} * 100 + ${frac:-0} ))
}
interval=2
previous=$(status)
read_centis; previous_centis=$centis
while :; do
  sleep "$interval"
  current=$(status)
  test -n "$current" || continue
  read_centis; dt_cs=$(( centis - previous_centis )); previous_centis=$centis
  if [ "$dt_cs" -lt 50 ] || [ "$dt_cs" -gt 6000 ]; then previous=$current; continue; fi
  ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
  printf '%s\n---\n%s\n' "$previous" "$current" | awk -v ts="$ts" -v dt="$(awk -v cs="$dt_cs" 'BEGIN { printf "%.2f", cs / 100 }')" 'BEGIN { first = 1 }
    /^---$/ { first = 0; next }
    first { p[$1] = $2; next }
    { c[$1] = $2 }
    END {
      # 現在値
      split("Threads_running threads_running Threads_connected threads_connected", gauge, " ")
      for (i = 1; i in gauge; i += 2)
        if (gauge[i] in c)
          printf "{\"type\":\"metric\",\"name\":\"mysql.%s\",\"value\":%s,\"unit\":\"threads\",\"labels\":{\"service\":\"mysql\"},\"timestamp\":\"%s\"}\n", gauge[i+1], c[gauge[i]], ts
      # 区間差分を毎秒あたりにする
      split("Queries queries Slow_queries slow_queries Innodb_row_lock_waits row_lock_waits Innodb_log_waits log_waits Innodb_buffer_pool_reads buffer_pool_reads Innodb_buffer_pool_read_requests buffer_pool_read_requests Innodb_data_fsyncs data_fsyncs", counter, " ")
      for (i = 1; i in counter; i += 2)
        if ((counter[i] in c) && (counter[i] in p))
          printf "{\"type\":\"metric\",\"name\":\"mysql.%s_per_second\",\"value\":%.3f,\"unit\":\"operations\",\"labels\":{\"service\":\"mysql\"},\"timestamp\":\"%s\"}\n", counter[i+1], (c[counter[i]] - p[counter[i]]) / dt, ts
      # 行lockの待ち時間はmsのcounter
      if (("Innodb_row_lock_time" in c) && ("Innodb_row_lock_time" in p))
        printf "{\"type\":\"metric\",\"name\":\"mysql.row_lock_time_ms_per_second\",\"value\":%.3f,\"unit\":\"ms\",\"labels\":{\"service\":\"mysql\"},\"timestamp\":\"%s\"}\n", (c["Innodb_row_lock_time"] - p["Innodb_row_lock_time"]) / dt, ts
    }'
  previous=$current
done
''']
unavailable_exit_codes = [75]

[[collectors]]
name = "mysql-log-mark"
phase = "before"
transport = "ssh"
roles = ["db", "mysql"]
preflight = ["sh", "-c", "command -v sha256sum >/dev/null || { echo sha256sum missing; exit 1; }; sudo -n test -r @@MYSQL_SLOW_LOG@@ && echo readable via sudo @@MYSQL_SLOW_LOG@@"]
command = ["sh", "-c", '''
set -eu
log=@@MYSQL_SLOW_LOG@@
marker=/tmp/isuscope-{run_id}.mysql.marker
command -v sha256sum >/dev/null 2>&1 || exit 75
command -v sudo >/dev/null 2>&1 || exit 75
sudo -n test -r "$log" || exit 75
offset=$(sudo -n wc -c < /dev/null "$log" | awk '{print $1}')
# 前回までの差分は回収済み。上限を超えたslow logは空にしてnodeのdiskを守る
# (mysqldはappendで書くので、次の行はfileの先頭から入る)。
limit=1073741824
if test "$offset" -gt "$limit" && sudo -n truncate -s 0 "$log"; then
  echo "truncated $log after it exceeded $limit bytes" >&2
  offset=$(sudo -n wc -c < /dev/null "$log" | awk '{print $1}')
fi
sample=$offset
test "$sample" -le 65536 || sample=65536
digest=$(sudo -n head -c "$sample" "$log" | sha256sum)
prefix=${digest%% *}
printf '%s %s %s\n' "$offset" "$sample" "$prefix" > "$marker"
''']
unavailable_exit_codes = [75]

[[collectors]]
name = "mysql-log-delta"
phase = "after"
transport = "ssh"
roles = ["db", "mysql"]
command = ["sh", "-c", '''
set -eu
log=@@MYSQL_SLOW_LOG@@
marker=/tmp/isuscope-{run_id}.mysql.marker
output=/tmp/isuscope-{run_id}.mysql.log
temporary=$output.tmp
trap 'rm -f "$temporary" "$marker"' EXIT
command -v sha256sum >/dev/null 2>&1 || exit 75
command -v sudo >/dev/null 2>&1 || exit 75
sudo -n test -r "$log" || exit 75
test -r "$marker" || exit 75
read offset sample prefix < "$marker" || exit 75
case "$offset:$sample" in *[!0-9:]*|:*|*:) exit 75 ;; esac

stream_file() {
  case "$1" in
    *.gz) sudo -n gzip -cd -- "$1" ;;
    *) sudo -n cat -- "$1" ;;
  esac
}
pick_generation() {
  plain=$log.$1
  compressed=$plain.gz
  if sudo -n test -r "$plain"; then
    printf '%s\n' "$plain"
  elif sudo -n test -r "$compressed" && sudo -n gzip -t -- "$compressed"; then
    printf '%s\n' "$compressed"
  else
    return 1
  fi
}
# 非圧縮の世代は大きさをmetadataから取る（`wc -c`は通常fileならfstatで済み、過去分を読み流さない）。
file_size() {
  case "$1" in
    *.gz) stream_file "$1" | wc -c | tr -d ' ' ;;
    *) sudo -n wc -c < /dev/null "$1" | awk '{print $1}' ;;
  esac
}
matches_marker() {
  size=$(file_size "$1")
  test "$size" -ge "$offset" || return 1
  digest=$(stream_file "$1" | head -c "$sample" | sha256sum)
  test "${digest%% *}" = "$prefix"
}

: > "$temporary"
if matches_marker "$log"; then
  sudo -n tail -c +$((offset + 1)) "$log" > "$temporary"
else
  origin_generation=0
  for generation in 1 2 3 4 5; do
    if candidate=$(pick_generation "$generation") && matches_marker "$candidate"; then
      origin_generation=$generation
      origin=$candidate
      break
    fi
  done
  if test "$origin_generation" -eq 0; then
    echo 'slow log rotated beyond retained generations or failed fingerprint validation' >&2
    exit 75
  fi
  stream_file "$origin" | tail -c +$((offset + 1)) > "$temporary"
  generation=$((origin_generation - 1))
  while test "$generation" -ge 1; do
    candidate=$(pick_generation "$generation") || {
      echo "slow log rotation generation $generation is missing" >&2
      exit 75
    }
    stream_file "$candidate" >> "$temporary"
    generation=$((generation - 1))
  done
  sudo -n cat "$log" >> "$temporary"
fi
mv "$temporary" "$output"
# 差分はこのnodeに置いたまま、後のslpが区間ごとに集計する。ここでは大きさだけを残す。
printf '{"type":"metric","name":"db.slow_log_bytes","value":%s,"unit":"bytes","labels":{"engine":"mysql"}}\n' "$(wc -c < "$output" | tr -d ' ')"
''']
unavailable_exit_codes = [75]

# survey-runでは、区間ごとの集計に加えて生のslow logも持ち帰る。後から別の観点で掘り直すためで、
# 通常のrunでは運ばない（DB 1台で1 runあたり数十MBになる）。
[[collectors]]
name = "mysql-log-raw"
phase = "after"
transport = "ssh"
roles = ["db", "mysql"]
modes = ["survey-run"]
command = ["sh", "-c", "input=/tmp/isuscope-{run_id}.mysql.log; test -r \"$input\" || exit 75; cat \"$input\""]
max_output_bytes = 1073741824
unavailable_exit_codes = [75]

# slow logの差分を、node上でinitializeと負荷区間に分けてslpで集計する。一括INSERTのVALUESと
# INの並びは1つの文にまとめ、回数・合計・最大・p95・p99・lock・rowsを文ごとに出す。
# 生のlogを運ばないので、DB 1台あたりの転送は数十KBで済む。slpはAnsibleのobservability roleが
# 入れる前提で、無ければ失敗させる（黙ってDBの計測が欠けないように）。
[[collectors]]
name = "slp"
phase = "after"
transport = "ssh"
roles = ["db", "mysql"]
preflight = ["sh", "-c", "command -v slp >/dev/null 2>&1 || { echo 'slp is not installed; install it with the Ansible observability role'; exit 1; }; echo slp available"]
command = ["sh", "-c", '''
set -eu
input=/tmp/isuscope-{run_id}.mysql.log
work=/tmp/isuscope-{run_id}.slp
trap 'rm -rf "$input" "$work"' EXIT
test -r "$input" || exit 75
command -v slp >/dev/null 2>&1 || { echo 'slp is not installed on this DB node; install it with the Ansible observability role' >&2; exit 1; }
mkdir -p "$work"
# 各文を`SET timestamp=`（文の開始時刻、epoch秒）で区間へ振り分ける。timezoneに依存しない。
# initializeの終わりが分からないrunは、全体を1つの区間（whole）にする。
# 同じ処理で、DB全体の5秒ごとの文の数と時間も出す。
awk -v load='{load_started_at}' -v end='{benchmark_finished_at}' -v dir="$work" '
  # prepared statementのPrepareや接続poolのPingは`# administrator command:`として記録される。
  # 文ではないので、slpと同じく数えない。
  # `SET timestamp=`が無く区間を決められなかった文は、負荷の後の文（意図して除く）と分けて数える。
  function flush() {
    if (window != "" && !administrative) {
      printf "%s", entry > (dir "/" window ".log")
      calls[bucket]++; seconds[bucket] += query_time; lock[bucket] += lock_time
    } else if (timed && !decided && !administrative) {
      unclassified++
    }
    entry = ""; window = ""; decided = 0; administrative = 0; timed = 0
  }
  /^# Time: / { flush() }
  /^# User@Host: / && (decided || timed) { flush() }
  /^# Query_time: / { query_time = $3; lock_time = $5; timed = 1 }
  /^# administrator command:/ { administrative = 1 }
  /^SET timestamp=/ && !decided {
    at = $0; sub(/^SET timestamp=/, "", at); sub(/;.*/, "", at); at += 0
    decided = 1
    if (end != "" && at > end + 0) window = ""
    else if (load == "") window = "whole"
    else if (at < load + 0) window = "initialize"
    else window = "load"
    bucket = int(at / 5) * 5
  }
  { entry = entry $0 "\n" }
  END {
    flush()
    print unclassified + 0 > (dir "/unclassified")
    if (unclassified > 0)
      printf "{\"type\":\"metric\",\"name\":\"db.slow_log_unclassified\",\"value\":%d,\"unit\":\"queries\",\"labels\":{\"engine\":\"mysql\"}}\n", unclassified
    for (bucket in calls) {
      printf "{\"type\":\"metric\",\"name\":\"db.calls\",\"value\":%d,\"unit\":\"queries\",\"labels\":{\"engine\":\"mysql\"},\"timestamp\":%d}\n", calls[bucket], bucket
      printf "{\"type\":\"metric\",\"name\":\"db.duration\",\"value\":%.3f,\"unit\":\"ms\",\"labels\":{\"engine\":\"mysql\"},\"timestamp\":%d}\n", seconds[bucket] * 1000, bucket
      printf "{\"type\":\"metric\",\"name\":\"db.lock_duration\",\"value\":%.3f,\"unit\":\"ms\",\"labels\":{\"engine\":\"mysql\"},\"timestamp\":%d}\n", lock[bucket] * 1000, bucket
    }
  }' "$input"
# 区間ごとに文の種類別へ集計する。`--limit`は種類の上限（超えると失敗）なので大きくしておく。
parsed=0
for window in initialize load whole; do
  test -s "$work/$window.log" || continue
  slp my --file "$work/$window.log" --format tsv --noheaders --bundle-values --bundle-where-in \
    --output count,query,sum-query-time,max-query-time,p95-query-time,p99-query-time,sum-lock-time,sum-rows-sent,sum-rows-examined \
    --percentiles 95,99 --limit 1000000 > "$work/$window.tsv"
  test -s "$work/$window.tsv" && parsed=1
  awk -v window="$window" '{ print window "\t" $0 }' "$work/$window.tsv"
done
# 文があったのに1件も集計できなければ、slow logの形式とslpかawkが合っていない。
unclassified=$(cat "$work/unclassified")
if [ "$unclassified" -gt 0 ]; then
  echo "$unclassified slow-log records had no SET timestamp and were not assigned to a window" >&2
fi
if [ "$parsed" = 0 ] && { ls "$work"/*.log >/dev/null 2>&1 || [ "$unclassified" -gt 0 ]; }; then
  echo 'slp parsed no records from a non-empty slow-log delta' >&2
  exit 65
fi
''']
parser = "slp-windows"
timeout_seconds = 120
unavailable_exit_codes = [75]

[package]
name = "isuscope"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
description = "Run recorder and discovery harness for ISUCON"
authors = ["Naohiro Matsuda"]
license = "MIT"
repository = "https://github.com/mnaog/isuscope"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
regex = "1.11"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.43", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
uuid = { version = "1.12", features = ["serde", "v7"] }
walkdir = "2.5"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.15"

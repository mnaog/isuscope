# このlog_formatをnginx.confへ追加し、survey-runでだけ使用します。
# 管理されたISUCON環境向けの要件に従い、SESSIONIDを意図的に記録します。
# 通常のproduction環境では、この形式をそのまま利用しないでください。
log_format isuscope_transition
    'time:$time_iso8601'
    '\tsession:$cookie_SESSIONID'
    '\tmethod:$request_method'
    '\turi:$request_uri'
    '\tstatus:$status'
    '\treqtime:$request_time';
